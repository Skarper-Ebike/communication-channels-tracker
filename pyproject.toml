[project]
name = "personal-work-agent"
version = "0.1.0"
description = "Personal Work Agent — fully local, per-employee work briefings"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
